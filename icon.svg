<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fond gradient bleu nuit -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Gradient sidebar -->
    <linearGradient id="sidebar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Gradient accent bleu -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <!-- Gradient groupe 2 (violet) -->
    <linearGradient id="grp2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <!-- Gradient groupe 3 (vert) -->
    <linearGradient id="grp3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Subtle shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>

  <!-- ── Fond arrondi ── -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- ── Panneau sidebar ── -->
  <rect x="48" y="64" width="168" height="384" rx="16" fill="url(#sidebar)" opacity="0.9"/>

  <!-- Ligne séparatrice sidebar -->
  <rect x="216" y="64" width="1.5" height="384" fill="rgba(255,255,255,0.07)"/>

  <!-- ── Logo HA (petit cercle en haut de la sidebar) ── -->
  <circle cx="132" cy="108" r="18" fill="url(#accent)" opacity="0.9"/>
  <text x="132" y="114" text-anchor="middle" font-size="18" fill="white" font-family="sans-serif">⌂</text>

  <!-- ── Groupe 1 — Bleu (ouvert) ── -->
  <!-- Header groupe 1 -->
  <rect x="60" y="148" width="144" height="36" rx="8" fill="url(#accent)" opacity="0.85" filter="url(#shadow)"/>
  <!-- Icône groupe 1 -->
  <circle cx="82" cy="166" r="9" fill="rgba(255,255,255,0.25)"/>
  <rect x="77" y="162" width="10" height="2" rx="1" fill="white"/>
  <rect x="77" y="166" width="7" height="2" rx="1" fill="white"/>
  <rect x="77" y="170" width="9" height="2" rx="1" fill="white"/>
  <!-- Texte groupe 1 -->
  <rect x="97" y="162" width="72" height="4" rx="2" fill="rgba(255,255,255,0.85)"/>
  <rect x="97" y="169" width="50" height="3" rx="1.5" fill="rgba(255,255,255,0.45)"/>
  <!-- Chevron bas (ouvert) -->
  <path d="M 196 162 l 5 5 l 5 -5" stroke="rgba(255,255,255,0.8)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Items groupe 1 -->
  <rect x="72" y="192" width="4" height="26" rx="2" fill="rgba(59,130,246,0.5)"/>
  <rect x="82" y="195" width="56" height="3.5" rx="1.75" fill="rgba(255,255,255,0.5)"/>
  <rect x="82" y="203" width="40" height="3" rx="1.5" fill="rgba(255,255,255,0.3)"/>
  <rect x="82" y="211" width="50" height="3" rx="1.5" fill="rgba(255,255,255,0.3)"/>

  <!-- ── Groupe 2 — Violet (fermé) ── -->
  <rect x="60" y="232" width="144" height="36" rx="8" fill="url(#grp2)" opacity="0.75"/>
  <circle cx="82" cy="250" r="9" fill="rgba(255,255,255,0.2)"/>
  <rect x="78" y="246" width="8" height="8" rx="2" fill="none" stroke="white" stroke-width="1.5"/>
  <rect x="97" y="246" width="64" height="4" rx="2" fill="rgba(255,255,255,0.8)"/>
  <rect x="97" y="253" width="44" height="3" rx="1.5" fill="rgba(255,255,255,0.4)"/>
  <!-- Chevron droite (fermé) -->
  <path d="M 196 246 l 5 5 l -5 5" stroke="rgba(255,255,255,0.7)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── Groupe 3 — Vert (fermé) ── -->
  <rect x="60" y="280" width="144" height="36" rx="8" fill="url(#grp3)" opacity="0.7"/>
  <circle cx="82" cy="298" r="9" fill="rgba(255,255,255,0.2)"/>
  <path d="M 78 298 l 3 3 l 6 -5" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="97" y="294" width="58" height="4" rx="2" fill="rgba(255,255,255,0.8)"/>
  <rect x="97" y="301" width="38" height="3" rx="1.5" fill="rgba(255,255,255,0.4)"/>
  <path d="M 196 294 l 5 5 l -5 5" stroke="rgba(255,255,255,0.7)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── Item standalone (non groupé) ── -->
  <rect x="60" y="332" width="144" height="30" rx="6" fill="rgba(255,255,255,0.05)"/>
  <rect x="76" y="343" width="50" height="3" rx="1.5" fill="rgba(255,255,255,0.3)"/>

  <!-- ── Panel config (partie droite) ── -->
  <!-- Fond panel -->
  <rect x="232" y="64" width="232" height="384" rx="16" fill="rgba(30,41,59,0.6)"/>

  <!-- Titre panel -->
  <rect x="252" y="92" width="120" height="8" rx="4" fill="rgba(255,255,255,0.7)"/>
  <rect x="252" y="106" width="80" height="5" rx="2.5" fill="rgba(255,255,255,0.25)"/>

  <!-- Badge serveur -->
  <rect x="360" y="89" width="88" height="20" rx="10" fill="rgba(74,222,128,0.15)" stroke="rgba(74,222,128,0.4)" stroke-width="1"/>
  <circle cx="374" cy="99" r="4" fill="#4ade80"/>
  <rect x="381" y="96" width="55" height="4" rx="2" fill="rgba(74,222,128,0.8)"/>

  <!-- Séparateur -->
  <rect x="252" y="124" width="192" height="1" fill="rgba(255,255,255,0.08)"/>

  <!-- Section label -->
  <rect x="252" y="136" width="60" height="4" rx="2" fill="rgba(255,255,255,0.25)"/>

  <!-- Pool éléments libres -->
  <rect x="252" y="148" width="192" height="44" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Chips libres -->
  <rect x="260" y="158" width="48" height="20" rx="10" fill="rgba(255,255,255,0.12)"/>
  <rect x="263" y="165" width="42" height="3.5" rx="1.75" fill="rgba(255,255,255,0.6)"/>
  <rect x="314" y="158" width="56" height="20" rx="10" fill="rgba(255,255,255,0.12)"/>
  <rect x="317" y="165" width="50" height="3.5" rx="1.75" fill="rgba(255,255,255,0.6)"/>
  <rect x="376" y="158" width="44" height="20" rx="10" fill="rgba(255,255,255,0.12)"/>
  <rect x="379" y="165" width="38" height="3.5" rx="1.75" fill="rgba(255,255,255,0.6)"/>

  <!-- Section label groupes -->
  <rect x="252" y="204" width="50" height="4" rx="2" fill="rgba(255,255,255,0.25)"/>

  <!-- Carte groupe éditable -->
  <rect x="252" y="216" width="192" height="100" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Header carte -->
  <circle cx="270" cy="232" r="8" fill="rgba(59,130,246,0.3)"/>
  <rect x="284" y="229" width="80" height="5" rx="2.5" fill="rgba(255,255,255,0.7)"/>
  <rect x="370" y="229" width="60" height="5" rx="2.5" fill="rgba(255,255,255,0.3)"/>
  <rect x="404" y="224" width="32" height="16" rx="8" fill="rgba(239,68,68,0.7)"/>
  <rect x="408" y="229" width="24" height="3.5" rx="1.75" fill="rgba(255,255,255,0.9)"/>
  <!-- Chips dans le groupe -->
  <rect x="260" y="248" width="192" height="36" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="266" y="258" width="50" height="18" rx="9" fill="url(#accent)"/>
  <rect x="269" y="264" width="44" height="3" rx="1.5" fill="rgba(255,255,255,0.9)"/>
  <rect x="322" y="258" width="56" height="18" rx="9" fill="url(#accent)"/>
  <rect x="325" y="264" width="50" height="3" rx="1.5" fill="rgba(255,255,255,0.9)"/>
  <rect x="384" y="258" width="60" height="18" rx="9" fill="rgba(255,255,255,0.1)"/>
  <rect x="387" y="264" width="54" height="3" rx="1.5" fill="rgba(255,255,255,0.5)"/>
  <!-- Accès select -->
  <rect x="260" y="292" width="50" height="4" rx="2" fill="rgba(255,255,255,0.3)"/>
  <rect x="316" y="288" width="116" height="16" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <rect x="322" y="293" width="80" height="3.5" rx="1.75" fill="rgba(255,255,255,0.5)"/>

  <!-- Bouton + Nouveau groupe -->
  <rect x="252" y="328" width="120" height="32" rx="16" fill="url(#accent)" filter="url(#shadow)"/>
  <rect x="272" y="340" width="80" height="4" rx="2" fill="rgba(255,255,255,0.9)"/>

  <!-- Bouton Export -->
  <rect x="380" y="328" width="64" height="32" rx="16" fill="rgba(255,255,255,0.08)"/>
  <rect x="390" y="340" width="44" height="4" rx="2" fill="rgba(255,255,255,0.5)"/>

  <!-- ── Icône flottante config (bas sidebar) ── -->
  <circle cx="132" cy="408" r="18" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <!-- Engrenage simplifié -->
  <circle cx="132" cy="408" r="6" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <circle cx="132" cy="408" r="2.5" fill="rgba(255,255,255,0.5)"/>
  <rect x="131" y="400" width="2" height="4" rx="1" fill="rgba(255,255,255,0.5)"/>
  <rect x="131" y="412" width="2" height="4" rx="1" fill="rgba(255,255,255,0.5)"/>
  <rect x="124" y="407" width="4" height="2" rx="1" fill="rgba(255,255,255,0.5)"/>
  <rect x="136" y="407" width="4" height="2" rx="1" fill="rgba(255,255,255,0.5)"/>

  <!-- ── Reflet glassmorphism sur le fond ── -->
  <rect x="48" y="64" width="416" height="80" rx="16" fill="rgba(255,255,255,0.03)"/>
</svg>
